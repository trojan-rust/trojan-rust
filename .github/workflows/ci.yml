name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      # --all-targets does not imply --all-features: without this, the geoip
      # and analytics code is never even compiled here.
      - run: cargo check --workspace --all-targets --all-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing says nothing about the others, and cancelling them
      # hides whether a failure is platform-specific — which is the first thing
      # worth knowing about it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Non-default features (analytics, geoip) carry their own tests.
      - run: cargo test --workspace --all-features

  interop:
    name: Client Interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # trojan-go comes from its release archive, not `go install`: the module
      # builds its optional features behind build tags, so `go install ...@latest`
      # yields a binary that knows only `-version` and rejects `-config`. That
      # still starts, so the old install looked fine and the failure only showed
      # up as a refused SOCKS5 connect inside the test. The release archive is
      # also what users actually run, and matches the dev shell's trojan-go.
      - name: Install reference clients
        run: |
          # A release download that dies mid-transfer (curl 56) is the whole
          # job lost to something no change here caused.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            -o /tmp/trojan-go.zip \
            https://github.com/p4gefau1t/trojan-go/releases/latest/download/trojan-go-linux-amd64.zip
          sudo unzip -o -q /tmp/trojan-go.zip trojan-go -d /usr/local/bin
          sudo chmod +x /usr/local/bin/trojan-go
          sudo apt-get update
          sudo apt-get install -y trojan

      # Both clients are driven by config file, so a binary that cannot parse
      # one is useless to these tests. Checking here means a broken install
      # fails with the reason rather than as a connection error later.
      - name: Verify the clients are usable
        run: |
          trojan-go -version
          trojan-go -h 2>&1 | grep -q -- '-config' \
            || { echo "trojan-go does not accept -config"; exit 1; }
          trojan --version
      # Kept out of the main test matrix because they need a client binary on
      # PATH, which is why they carry #[ignore]. TROJAN_INTEROP_REQUIRED makes
      # a missing binary fatal here, so this job cannot pass without having
      # driven a real client; elsewhere the tests skip visibly instead, since
      # the C++ client has no macOS build.
      - name: Run interop tests
        env:
          # Makes a missing client binary fatal here, so this job cannot pass
          # without having actually driven one.
          TROJAN_INTEROP_REQUIRED: 1
        run: cargo test -p trojan-server --test trojan_client_test -- --include-ignored --test-threads=1

  analytics:
    name: Analytics (ClickHouse)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        ports:
          - 8123:8123
        env:
          # Leaves the default user without a password, which is what the
          # tests connect as.
          CLICKHOUSE_SKIP_USER_SETUP: 1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # #[ignore]d so the main matrix does not need a database. They panic
      # rather than skip when the URL is unset, so this job cannot pass
      # without a server. The mock-based tests in the same file cannot reach
      # the insert path: the client opens one with DESCRIBE TABLE and answers
      # are LZ4-framed, so only a real server exercises it.
      - name: Run analytics tests
        env:
          TROJAN_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
        run: cargo test -p trojan-server --features analytics --test analytics_clickhouse -- --include-ignored --test-threads=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"  # Rust 2024 edition MSRV
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
