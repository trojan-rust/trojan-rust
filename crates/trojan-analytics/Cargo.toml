[package]
name = "trojan-analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Analytics module for trojan-rs with ClickHouse support"
keywords = ["trojan", "analytics", "clickhouse", "metrics"]
categories = ["network-programming"]
readme = "README.md"

[features]
default = ["collector"]
# The event collector and its ClickHouse writer. Without it only the config
# types compile, which is all `trojan-config` needs to compose them.
collector = ["dep:trojan-core", "dep:clickhouse", "dep:time", "dep:tokio", "dep:serde_json", "dep:tracing", "dep:thiserror", "dep:rand"]

[dependencies]
serde.workspace = true
# Only for `GeoipConfig`; the rule engine and GeoIP loader stay out.
trojan-rules = { version = "0.11.0", path = "../trojan-rules", default-features = false }

trojan-core = { workspace = true, optional = true }
clickhouse = { version = "0.15", features = ["inserter", "time"], optional = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util"], optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
rand = { version = "0.10", optional = true }

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
