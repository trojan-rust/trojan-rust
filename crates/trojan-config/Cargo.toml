[package]
name = "trojan-config"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Configuration loading and validation for trojan-rs"
keywords = ["trojan", "proxy", "config"]
categories = ["network-programming", "config"]
readme = "README.md"

[dependencies]
trojan-core.workspace = true
trojan-dns.workspace = true
# Only for `GeoipConfig`; the engine, GeoIP loader and HTTP providers stay out.
trojan-rules = { version = "0.12.0", path = "../trojan-rules", default-features = false }
# Only for `DdnsConfig`; the Cloudflare updater stays out.
trojan-ddns = { version = "0.12.0", path = "../trojan-ddns", default-features = false }
# Only for `AnalyticsConfig`; the collector and ClickHouse writer stay out.
trojan-analytics = { version = "0.12.0", path = "../trojan-analytics", default-features = false }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
thiserror.workspace = true
json_comments = "0.2.2"
ipnet.workspace = true

[lints]
workspace = true
